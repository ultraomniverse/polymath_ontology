<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daniel Gascón — Polímata</title>
<meta name="description" content="Portafolio de Daniel Gascón, polímata. Próximamente aquí se enlazarán sus trabajos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Cormorant+Garamond:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --white:#ffffff;
    --ink:#000000;
    --soft:#3a3a3a;
    --faint:#8d8d8d;
    --gold:#9a7b1e;
    --rule:rgba(0,0,0,.16);
    --rule-2:rgba(0,0,0,.34);
    --gothic:"UnifrakturMaguntia",serif;
    --mono:"JetBrains Mono",ui-monospace,monospace;
    --serif:"Cormorant Garamond",Georgia,serif;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
  body{
    margin:0;background:var(--white);color:var(--ink);
    font-family:var(--serif);font-size:16px;line-height:1.6;
    -webkit-font-smoothing:antialiased;text-align:center;
    min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden;
  }
  /* cuadrícula */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:
      linear-gradient(to right, var(--rule-2) 1px, transparent 1px),
      linear-gradient(to bottom, var(--rule-2) 1px, transparent 1px),
      linear-gradient(to right, var(--rule) 1px, transparent 1px),
      linear-gradient(to bottom, var(--rule) 1px, transparent 1px);
    background-size:96px 96px, 96px 96px, 24px 24px, 24px 24px;
  }
  /* viñeta */
  body::after{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(ellipse at 50% 42%, transparent 32%, rgba(0,0,0,.055) 100%);
  }
  #stoch{position:fixed;inset:0;z-index:0;pointer-events:none;width:100%;height:100%;opacity:.85}

  /* ---------- marco ---------- */
  .frame{position:fixed;inset:9px;z-index:2;pointer-events:none;border:1px solid rgba(0,0,0,.42)}
  .frame::before{content:"";position:absolute;inset:4px;border:1px solid rgba(0,0,0,.13)}
  .frame span{position:absolute;width:13px;height:13px;border:0 solid var(--ink)}
  .frame span:nth-child(1){top:-1px;left:-1px;border-top-width:2px;border-left-width:2px}
  .frame span:nth-child(2){top:-1px;right:-1px;border-top-width:2px;border-right-width:2px}
  .frame span:nth-child(3){bottom:-1px;left:-1px;border-bottom-width:2px;border-left-width:2px}
  .frame span:nth-child(4){bottom:-1px;right:-1px;border-bottom-width:2px;border-right-width:2px}

  /* márgenes técnicos */
  .margen{
    position:fixed;top:50%;z-index:2;pointer-events:none;
    font-family:var(--mono);font-size:.46rem;letter-spacing:.3em;text-transform:uppercase;
    color:var(--faint);white-space:nowrap;
  }
  .margen.izq{left:16px;transform:translateY(-50%) rotate(180deg);writing-mode:vertical-rl}
  .margen.der{right:16px;transform:translateY(-50%);writing-mode:vertical-rl}
  @media (max-width:720px){.margen{display:none}}

  .wrap{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;
        width:100%;max-width:820px;margin:0 auto;padding:0 clamp(1rem,5vw,2rem)}

  /* ---------- header ---------- */
  header{
    padding:clamp(2.4rem,7vw,4rem) 0 clamp(1.4rem,3vw,2rem);
    border-bottom:1px solid var(--ink);
    display:flex;flex-direction:column;align-items:center;gap:.9rem;
    position:relative;
  }
  header::after{
    content:"";position:absolute;left:50%;bottom:-4px;width:70px;height:7px;
    transform:translateX(-50%);background:var(--white);
  }
  .sigilo{width:clamp(140px,30vw,208px);height:auto;color:var(--ink);position:relative}
  .sigilo svg{width:100%;height:auto;display:block;overflow:visible}
  .sigilo::before{
    content:"";position:absolute;inset:-14%;border-radius:50%;z-index:-1;
    background:radial-gradient(circle, rgba(154,123,30,.20), transparent 68%);
    filter:blur(6px);
  }
  .ring{transform-origin:100px 100px;animation:giro 74s linear infinite}
  .ring2{transform-origin:100px 100px;animation:giro 128s linear infinite reverse}
  @keyframes giro{to{transform:rotate(360deg)}}
  .iris{transition:transform .35s cubic-bezier(.2,.8,.3,1)}

  h1{
    font-family:var(--gothic);font-weight:400;letter-spacing:.005em;
    font-size:clamp(2.15rem,7.8vw,4rem);line-height:1;margin:.5rem 0 0;
  }
  .bajo{
    display:flex;align-items:center;gap:.7rem;width:100%;max-width:340px;
    font-family:var(--mono);font-size:.5rem;letter-spacing:.34em;text-transform:uppercase;
    color:var(--faint);margin:0;
  }
  .bajo::before,.bajo::after{content:"";flex:1;height:1px;background:var(--rule-2)}
  .bajo b{font-weight:400;color:var(--soft)}

  /* ---------- hero ---------- */
  .hero{padding:clamp(2rem,5vw,3rem) 0;border-bottom:1px solid var(--rule);position:relative}
  .motto{
    font-family:var(--mono);font-size:.58rem;letter-spacing:.62em;text-transform:uppercase;
    color:var(--gold);margin:0 0 1.3rem;
  }
  .rol{
    font-family:var(--mono);font-size:.72rem;letter-spacing:.5em;text-transform:uppercase;
    margin:0 0 1.5rem;color:var(--ink);
  }
  .rol i{font-style:normal;color:var(--gold);letter-spacing:0}
  .declara{
    font-family:var(--gothic);font-size:clamp(1.18rem,3.3vw,1.7rem);line-height:1.55;
    max-width:31ch;margin:0 auto;color:var(--ink);
  }
  .declara em{font-style:normal;text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:5px}

  /* ---------- proyectos ---------- */
  section{padding:clamp(2.2rem,5vw,3rem) 0;border-bottom:1px solid var(--rule)}
  .lab{
    display:flex;align-items:center;justify-content:center;gap:.85rem;
    font-family:var(--mono);font-size:.56rem;letter-spacing:.36em;text-transform:uppercase;
    color:var(--faint);margin:0 0 1.5rem;
  }
  .lab .rn{color:var(--gold);letter-spacing:.1em;font-size:.68rem}
  .lab::before,.lab::after{content:"";width:34px;height:1px;background:var(--rule-2)}

  .indice{list-style:none;margin:0 auto;padding:0;max-width:500px;border-top:1px solid var(--rule)}
  .indice li{border-bottom:1px solid var(--rule);position:relative}
  .indice a{
    display:flex;align-items:center;justify-content:space-between;gap:1rem;
    padding:.9rem .55rem;text-decoration:none;color:var(--ink);
    font-family:var(--mono);font-size:.8rem;letter-spacing:.2em;
    transition:background .14s,color .14s,padding .14s;
  }
  .indice a:hover{background:#000;color:#fff;padding-left:1rem;padding-right:1rem}
  .indice .izq{display:flex;align-items:center;gap:.75rem;min-width:0}
  .indice .n{color:var(--faint);flex:0 0 auto}
  .indice a:hover .n{color:var(--gold)}
  .indice .nom{
    font-family:var(--gothic);font-size:1.05rem;letter-spacing:.02em;
    color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .indice a:hover .nom{color:#fff}
  .indice .flecha{font-size:.85rem;transition:transform .14s;flex:0 0 auto}
  .indice a:hover .flecha{transform:translateX(3px)}
  .vacio{
    font-family:var(--mono);font-size:.58rem;letter-spacing:.24em;text-transform:uppercase;
    color:var(--faint);padding:1rem 0 .2rem;
  }

  /* ---------- footer ---------- */
  footer{
    padding:1.7rem 0 2.2rem;display:flex;flex-direction:column;align-items:center;gap:.45rem;
    font-family:"Comic Sans MS","Comic Neue","Chalkboard SE",cursive;
    font-size:9px;line-height:1.4;letter-spacing:.06em;color:var(--faint);
  }
  footer .bye{font-size:9px}
  footer .cop{font-size:8px;color:#b3b3b3}

  @media print{#stoch,.frame,.margen{display:none}body::before{display:none}}
</style>
</head>
<body>
<canvas id="stoch" aria-hidden="true"></canvas>
<div class="frame" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
<div class="margen izq" aria-hidden="true">6°14′N · 75°34′W · Medellín</div>
<div class="margen der" aria-hidden="true">Ordo ab chao · A∴D∴ 2026</div>

<div class="wrap">

  <header>
    <div class="sigilo" aria-hidden="true">
      <svg viewBox="0 0 200 200" fill="none" stroke="currentColor">
        <g stroke-width="1" opacity=".55">
          <path d="M100 4v13M100 183v13M4 100h13M183 100h13M32 32l9 9M159 159l9 9M168 32l-9 9M41 159l-9 9"/>
          <path d="M100 12v5M100 188v5M12 100h5M188 100h5" stroke-width="2"/>
        </g>
        <circle cx="100" cy="100" r="78" stroke-width="1"/>
        <g class="ring" stroke-width=".8" opacity=".7">
          <circle cx="100" cy="100" r="88" stroke-dasharray="1 7"/>
        </g>
        <g class="ring2" stroke-width="1.1" opacity=".45">
          <circle cx="100" cy="100" r="69" stroke-dasharray="14 5 2 5"/>
        </g>
        <path d="M100 158 L51.2 48.8 L163.7 119.4 L36.3 119.4 L148.8 48.8 Z" stroke-width="2.6" stroke-linejoin="miter"/>
        <g class="ojo">
          <path d="M79 100 Q100 84 121 100 Q100 116 79 100 Z" stroke-width="1.6" fill="#fff"/>
          <circle class="iris" cx="100" cy="100" r="6.4" stroke-width="1.4" fill="#fff"/>
          <circle cx="100" cy="100" r="2.3" fill="currentColor" stroke="none"/>
          <path d="M100 84v-5M100 116v5M79 100h-5M121 100h5" stroke-width=".9" opacity=".6"/>
        </g>
      </svg>
    </div>

    <h1>Daniel Gascón</h1>
    <p class="bajo"><b>Polímata</b></p>
  </header>

  <div class="hero">
    <p class="motto">Ordo ab chao</p>
    <p class="rol"><i>∴</i> Polímata <i>∴</i></p>
    <p class="declara">Próximamente aquí se enlazarán sus <em>trabajos</em>.</p>
  </div>

  <section id="trabajos">
    <p class="lab"><span class="rn">I</span> Trabajos <span class="rn">I</span></p>
    <ul class="indice" id="indice"></ul>
    <p class="vacio">+ en preparación</p>
  </section>

  <footer>
    <span class="bye">goodbye association</span>
    <span class="cop">© Daniel Gascón</span>
  </footer>
</div>

<script>
/* ==========================================================
   PROYECTOS — nombre opcional, href obligatorio.
   ========================================================== */
const PROYECTOS = [
  { href: "#" }, { href: "#" }, { href: "#" }, { href: "#" }, { href: "#" }
];

const indice = document.getElementById('indice');
PROYECTOS.forEach((p, i) => {
  const li = document.createElement('li');
  const a = document.createElement('a');
  a.href = p.href || '#';
  if (p.href && p.href !== '#' && !p.href.endsWith('.html')) { a.target = '_blank'; a.rel = 'noopener'; }
  const n = String(i + 1).padStart(2, '0');
  a.innerHTML = p.nombre
    ? `<span class="izq"><span class="n">${n}</span><span class="nom">${p.nombre}</span></span><span class="flecha" aria-hidden="true">→</span>`
    : `<span class="n">${n}</span><span class="flecha" aria-hidden="true">→</span>`;
  li.appendChild(a); indice.appendChild(li);
});

/* el iris sigue al puntero */
const iris = document.querySelector('.iris');
const sigilo = document.querySelector('.sigilo');
addEventListener('mousemove', e => {
  const r = sigilo.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const dx = Math.max(-1, Math.min(1, (e.clientX - cx) / 160));
  const dy = Math.max(-1, Math.min(1, (e.clientY - cy) / 160));
  iris.style.transform = `translate(${dx * 3.4}px, ${dy * 3}px)`;
});

/* ---------- fondo estocástico ---------- */
(function(){
  const cv = document.getElementById('stoch');
  const ctx = cv.getContext('2d');
  const quieto = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W, H, DPR;
  function medir(){
    DPR = Math.min(devicePixelRatio || 1, 2);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H); nube();
  }
  function nube(){
    ctx.fillStyle = 'rgba(0,0,0,.28)';
    const n = Math.round((W * H) / 30000);
    for (let i = 0; i < n; i++){
      ctx.beginPath();
      ctx.arc(Math.random() * W, Math.random() * H, Math.random() * .95 + .3, 0, 6.2832);
      ctx.fill();
    }
  }
  const cam = [];
  function sembrar(){
    cam.length = 0;
    for (let i = 0; i < 14; i++){
      cam.push({ x: Math.random()*W, y: Math.random()*H, dx:(Math.random()-.5), dy:(Math.random()-.5), vida: 180+Math.random()*460, paso:.5+Math.random()*.8 });
    }
  }
  let t = 0;
  function paso(){
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = 'rgba(0,0,0,.03)';
    ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation = 'source-over';
    t++; if (t % 420 === 0) nube();
    for (const c of cam){
      c.dx += (Math.random()-.5)*.4; c.dy += (Math.random()-.5)*.4;
      c.dx *= .965; c.dy *= .965;
      const nx = c.x + c.dx*c.paso, ny = c.y + c.dy*c.paso;
      ctx.strokeStyle = 'rgba(0,0,0,.16)'; ctx.lineWidth = .8;
      ctx.beginPath(); ctx.moveTo(c.x,c.y); ctx.lineTo(nx,ny); ctx.stroke();
      c.x = nx; c.y = ny; c.vida--;
      if (c.vida < 0 || c.x < -20 || c.x > W+20 || c.y < -20 || c.y > H+20){
        c.x = Math.random()*W; c.y = Math.random()*H;
        c.dx = (Math.random()-.5); c.dy = (Math.random()-.5);
        c.vida = 180+Math.random()*460;
      }
    }
    if (!quieto) requestAnimationFrame(paso);
  }
  medir(); sembrar();
  if (quieto){ for (let i=0;i<900;i++) paso(); } else requestAnimationFrame(paso);
  let tm; addEventListener('resize', () => { clearTimeout(tm); tm = setTimeout(() => { medir(); sembrar(); }, 220); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !quieto) requestAnimationFrame(paso); });
})();
</script>
</body>
</html>
