<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daniel Gascón — Polímata</title>
<meta name="description" content="Portafolio de Daniel Gascón, polímata. Próximamente aquí se enlazarán sus trabajos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --white:#ffffff;
    --ink:#000000;
    --soft:#3a3a3a;
    --faint:#8d8d8d;
    --rule:rgba(0,0,0,.16);
    --rule-2:rgba(0,0,0,.34);
    --gothic:"UnifrakturMaguntia",serif;
    --mono:"JetBrains Mono",ui-monospace,monospace;
    --ui:"Inter",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
  body{
    margin:0;background:var(--white);color:var(--ink);
    font-family:var(--ui);font-size:16px;line-height:1.6;
    -webkit-font-smoothing:antialiased;text-align:center;
    min-height:100vh;display:flex;flex-direction:column;
  }
  /* cuadrícula */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:
      linear-gradient(to right, var(--rule-2) 1px, transparent 1px),
      linear-gradient(to bottom, var(--rule-2) 1px, transparent 1px),
      linear-gradient(to right, var(--rule) 1px, transparent 1px),
      linear-gradient(to bottom, var(--rule) 1px, transparent 1px);
    background-size:96px 96px, 96px 96px, 24px 24px, 24px 24px;
  }
  #stoch{position:fixed;inset:0;z-index:0;pointer-events:none;width:100%;height:100%;opacity:.9}

  .wrap{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;
        width:100%;max-width:860px;margin:0 auto;padding:0 clamp(1rem,4vw,2rem)}

  /* ---------- header ---------- */
  header{
    padding:clamp(2rem,6vw,3.4rem) 0 clamp(1.2rem,3vw,2rem);
    border-bottom:1px solid var(--ink);
    display:flex;flex-direction:column;align-items:center;gap:1.1rem;
  }
  .pent{width:clamp(66px,13vw,96px);height:auto;display:block;color:var(--ink)}
  .pent svg{width:100%;height:auto;display:block;overflow:visible}
  h1{
    font-family:var(--gothic);font-weight:400;letter-spacing:.01em;
    font-size:clamp(2.1rem,7.4vw,3.9rem);line-height:1;margin:0;
  }
  .sub{
    font-family:var(--mono);font-size:.6rem;letter-spacing:.42em;text-transform:uppercase;
    color:var(--soft);margin:0;
  }

  /* ---------- hero ---------- */
  .hero{padding:clamp(2rem,5vw,3rem) 0;border-bottom:1px solid var(--rule)}
  .rol{
    font-family:var(--mono);font-size:.7rem;letter-spacing:.55em;text-transform:uppercase;
    margin:0 0 1.4rem;color:var(--ink);
  }
  .declara{
    font-family:var(--gothic);font-size:clamp(1.15rem,3.2vw,1.65rem);line-height:1.5;
    max-width:32ch;margin:0 auto;color:var(--ink);
  }
  .declara em{font-style:normal;text-decoration:underline;text-underline-offset:4px}
  .sello{
    display:inline-flex;align-items:center;gap:.5rem;margin-top:1.7rem;
    font-family:var(--mono);font-size:.55rem;letter-spacing:.24em;text-transform:uppercase;
    color:var(--soft);border:1px solid var(--rule-2);border-radius:100px;padding:.4rem .8rem;
  }
  .dot{width:5px;height:5px;border-radius:50%;background:var(--ink);animation:p 2.2s ease-in-out infinite}
  @keyframes p{0%,100%{opacity:1}50%{opacity:.15}}

  /* ---------- proyectos ---------- */
  section{padding:clamp(2.2rem,5vw,3rem) 0;border-bottom:1px solid var(--rule)}
  .lab{
    font-family:var(--mono);font-size:.58rem;letter-spacing:.34em;text-transform:uppercase;
    color:var(--faint);margin:0 0 1.4rem;
  }
  .indice{list-style:none;margin:0 auto;padding:0;max-width:520px;border-top:1px solid var(--rule)}
  .indice li{border-bottom:1px solid var(--rule)}
  .indice a{
    display:flex;align-items:center;justify-content:space-between;gap:1rem;
    padding:.85rem .3rem;text-decoration:none;color:var(--ink);
    font-family:var(--mono);font-size:.82rem;letter-spacing:.16em;
    transition:background .12s,padding .12s;
  }
  .indice a:hover{background:#000;color:#fff;padding-left:.8rem;padding-right:.8rem}
  .indice .n{color:var(--faint)}
  .indice a:hover .n{color:#fff}
  .indice .flecha{font-size:.9rem}
  .vacio{
    font-family:var(--mono);font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;
    color:var(--faint);padding:.9rem 0;text-align:center;
  }

  /* ---------- footer ---------- */
  footer{
    padding:1.6rem 0 2rem;
    font-family:"Comic Sans MS","Comic Neue","Chalkboard SE",cursive;
    font-size:9px;line-height:1.4;letter-spacing:.06em;color:var(--faint);
    display:flex;flex-direction:column;align-items:center;gap:.5rem;
  }
  footer .bye{font-size:9px}
  footer .legal{font-family:var(--mono);font-size:.5rem;letter-spacing:.2em;text-transform:uppercase;color:#b3b3b3}

  /* ---------- player ---------- */
  .player{
    position:fixed;left:50%;transform:translateX(-50%);bottom:.85rem;z-index:5;
    display:flex;align-items:center;gap:.5rem;
    background:#000;color:#fff;border-radius:100px;padding:.32rem .8rem .32rem .32rem;
    font-family:var(--mono);font-size:.5rem;letter-spacing:.18em;text-transform:uppercase;
    box-shadow:0 8px 24px -14px #000;
  }
  .player button{
    width:24px;height:24px;border-radius:50%;border:1px solid rgba(255,255,255,.5);
    background:transparent;color:#fff;display:grid;place-items:center;cursor:pointer;flex:0 0 auto;
  }
  .player button:hover{background:rgba(255,255,255,.18)}
  .player svg{width:10px;height:10px}
  .eq{display:none;gap:2px;align-items:flex-end;height:9px}
  .player.on .eq{display:flex}
  .eq i{width:2px;background:#fff;animation:eq .85s ease-in-out infinite}
  .eq i:nth-child(2){animation-delay:.14s}
  .eq i:nth-child(3){animation-delay:.28s}
  @keyframes eq{0%,100%{height:2px}50%{height:9px}}
  .player .meta{white-space:nowrap}

  @media print{#stoch,.player{display:none}body::before{display:none}}
</style>
</head>
<body>
<canvas id="stoch" aria-hidden="true"></canvas>

<div class="wrap">

  <header>
    <div class="pent" aria-hidden="true">
      <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="miter">
        <circle cx="50" cy="50" r="45.5"/>
        <path d="M50 94 L24.14 14.4 L91.85 63.6 L8.15 63.6 L75.86 14.4 Z"/>
      </svg>
    </div>
    <h1>Daniel Gascón</h1>
    <p class="sub">Portafolio</p>
  </header>

  <div class="hero">
    <p class="rol">Polímata</p>
    <p class="declara">Próximamente aquí se enlazarán sus <em>trabajos</em>.</p>
    <span class="sello"><span class="dot"></span> Sitio en construcción</span>
  </div>

  <section>
    <p class="lab">Trabajos</p>
    <ul class="indice" id="indice"></ul>
  </section>

  <footer>
    <span class="bye">goodbye</span>
    <span class="legal">© 2026 Daniel Gascón</span>
  </footer>
</div>

<div class="player" id="player">
  <button id="play" aria-label="Reproducir o pausar sonido">
    <svg id="ico" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
  </button>
  <span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>
  <span class="meta">Xenakis</span>
</div>

<script>
/* ==========================================================
   ENLACES — pon tus href aquí. Se generan como 01, 02, 03…
   ========================================================== */
const PROYECTOS = [
  { href: "#" },
  { href: "#" },
  { href: "#" },
  { href: "#" },
  { href: "#" }
];

const indice = document.getElementById('indice');
PROYECTOS.forEach((p, i) => {
  const li = document.createElement('li');
  const a = document.createElement('a');
  a.href = p.href || '#';
  if (p.href && p.href !== '#') { a.target = '_blank'; a.rel = 'noopener'; }
  const n = String(i + 1).padStart(2, '0');
  a.innerHTML = `<span class="n">${n}</span><span class="flecha" aria-hidden="true">→</span>`;
  li.appendChild(a);
  indice.appendChild(li);
});
const vacio = document.createElement('p');
vacio.className = 'vacio';
vacio.textContent = '+ en preparación';
indice.parentElement.appendChild(vacio);

/* ---------- audio ---------- */
const audio = new Audio('https://archive.org/download/04IannisXenakisAkrata/05%20-%20Iannis%20Xenakis%20-%20Achorripsis.mp3');
audio.loop = true;
audio.volume = 0.4;
const player = document.getElementById('player');
const playBtn = document.getElementById('play');
const ico = document.getElementById('ico');
const PLAY = '<path d="M8 5v14l11-7z"/>';
const PAUSE = '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>';

function pintar(on){
  player.classList.toggle('on', on);
  ico.innerHTML = on ? PAUSE : PLAY;
  playBtn.setAttribute('aria-label', on ? 'Pausar sonido' : 'Reproducir sonido');
}
playBtn.addEventListener('click', () => {
  if (audio.paused) audio.play().then(() => pintar(true)).catch(() => {});
  else { audio.pause(); pintar(false); }
});
audio.addEventListener('play', () => pintar(true));
audio.addEventListener('pause', () => pintar(false));

audio.play().then(() => pintar(true)).catch(() => {});
document.addEventListener('click', function arranque(){
  if (audio.paused) audio.play().then(() => pintar(true)).catch(() => {});
  document.removeEventListener('click', arranque);
}, { once: true });

/* ---------- fondo estocástico ---------- */
(function(){
  const cv = document.getElementById('stoch');
  const ctx = cv.getContext('2d');
  const quieto = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W, H, DPR;

  function medir(){
    DPR = Math.min(devicePixelRatio || 1, 2);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);
    nube();
  }

  function nube(){
    ctx.fillStyle = 'rgba(0,0,0,.30)';
    const n = Math.round((W * H) / 30000);
    for (let i = 0; i < n; i++){
      ctx.beginPath();
      ctx.arc(Math.random() * W, Math.random() * H, Math.random() * .95 + .3, 0, 6.2832);
      ctx.fill();
    }
  }

  const caminantes = [];
  function sembrar(){
    caminantes.length = 0;
    for (let i = 0; i < 14; i++){
      caminantes.push({
        x: Math.random() * W, y: Math.random() * H,
        dx: (Math.random() - .5), dy: (Math.random() - .5),
        vida: 180 + Math.random() * 460,
        paso: .5 + Math.random() * .8
      });
    }
  }

  let t = 0;
  function paso(){
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = 'rgba(0,0,0,.03)';
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';

    t++;
    if (t % 420 === 0) nube();

    for (const c of caminantes){
      c.dx += (Math.random() - .5) * .4;
      c.dy += (Math.random() - .5) * .4;
      c.dx *= .965; c.dy *= .965;
      const nx = c.x + c.dx * c.paso;
      const ny = c.y + c.dy * c.paso;
      ctx.strokeStyle = 'rgba(0,0,0,.17)';
      ctx.lineWidth = .8;
      ctx.beginPath();
      ctx.moveTo(c.x, c.y);
      ctx.lineTo(nx, ny);
      ctx.stroke();
      c.x = nx; c.y = ny;
      c.vida--;
      if (c.vida < 0 || c.x < -20 || c.x > W + 20 || c.y < -20 || c.y > H + 20){
        c.x = Math.random() * W; c.y = Math.random() * H;
        c.dx = (Math.random() - .5); c.dy = (Math.random() - .5);
        c.vida = 180 + Math.random() * 460;
      }
    }
    if (!quieto) requestAnimationFrame(paso);
  }

  medir(); sembrar();
  if (quieto){ for (let i = 0; i < 900; i++) paso(); }
  else requestAnimationFrame(paso);

  let timer;
  addEventListener('resize', () => {
    clearTimeout(timer);
    timer = setTimeout(() => { medir(); sembrar(); }, 220);
  });
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && !quieto) requestAnimationFrame(paso);
  });
})();
</script>
</body>
</html>
